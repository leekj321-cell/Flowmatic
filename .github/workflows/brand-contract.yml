name: Brand contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install static-site build dependency
        run: python3 -m pip install beautifulsoup4==4.14.3
      - name: Verify locked CI assets
        run: python3 tools/validate_brand_contract.py
      - name: Verify public NC example and translations
        run: python3 tools/validate_nc_public_release.py
      - name: Verify NC viewer behavior
        run: node --test tests/nc-viewer.test.cjs
