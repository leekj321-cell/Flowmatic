name: Website business-first release QA
on:
  push:
    branches: [web/business-first-20260910, main]
    paths:
      - business_narrative.py
      - business-narrative.css
      - tools/apply_business_narrative.py
      - tools/web_business_qa.py
      - build_site.py
      - web_release_content.py
      - web-refresh.css
      - .github/workflows/web-release-20260910.yml
permissions:
  contents: write
concurrency:
  group: website-business-first-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: |
          python -m pip install playwright==1.58.0 beautifulsoup4==4.14.3 Pillow==12.1.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Install and build approved business narrative
        run: |
          python tools/apply_business_narrative.py
          python -m py_compile business_narrative.py tools/web_business_qa.py
          python build_site.py
      - name: Protect original motion, viewer, media, domain and brand
        run: |
          git fetch --depth=1 origin 34faae11f9c63ecb031f0a727473c738b939d8fc
          python - <<'PY'
          import ast, subprocess
          from pathlib import Path
          base='34faae11f9c63ecb031f0a727473c738b939d8fc'
          protected=['CNAME','script.js','style-v5.20.css','nc-viewer-3d.js','nc-viewer-core.js','nc-viewer-canvas.js','nc-viewer-3d.css','flowmatic_nc_demo.mp4','flowmatic_ct_demo.mp4','demo-data/flowmatic-nc-sample.nc']
          for path in protected:
              assert Path(path).read_bytes()==subprocess.check_output(['git','show',base+':'+path]), path
          before=subprocess.check_output(['git','show',base+':build_site.py']).decode().replace('\r\n','\n')
          after=Path('build_site.py').read_text()
          for name in ['home_composition_section','operations_story_section','field_story']:
              def source(text):
                  node=next(n for n in ast.parse(text).body if isinstance(n,ast.FunctionDef) and n.name==name)
                  return ast.get_source_segment(text,node)
              assert source(before)==source(after), name
          print('PASS: original domain, motion, viewer, video bytes and animation render functions preserved')
          PY
          python tools/validate_brand_contract.py
          python tools/validate_nc_public_release.py
          node --test tests/nc-viewer.test.cjs
      - name: Candidate browser and meaning-position regression
        id: candidate
        if: github.ref == 'refs/heads/web/business-first-20260910'
        run: python tools/web_business_qa.py --browser
      - name: Await exact official release
        if: github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import json,time,urllib.request
          for i in range(45):
              try:
                  u='https://flowmatic-os.com/release.json?verify='+str(time.time())
                  data=json.load(urllib.request.urlopen(u,timeout=20))
                  if data.get('release')=='2026.09.10-r2':break
              except Exception as exc: print(type(exc).__name__)
              time.sleep(10)
          else:raise SystemExit('Official domain did not reach r2; deployment is not verified')
          PY
      - name: Official domain browser regression
        if: github.ref == 'refs/heads/main'
        run: python tools/web_business_qa.py --browser --base https://flowmatic-os.com
      - name: Commit only a passing candidate for visual review
        if: success() && github.ref == 'refs/heads/web/business-first-20260910'
        run: |
          git config user.name 'Flowmatic Web Release'
          git config user.email 'automation@flowmatic-os.com'
          git add build_site.py business_narrative.py business-narrative.css tools/apply_business_narrative.py tools/web_business_qa.py IMPLEMENTATION_NOTES.md release.json robots.txt sitemap.xml '*.html' ko en ar html-vnext
          git add -u .release-transfer || true
          if ! git diff --cached --quiet; then
            git commit -m 'Build verified business-first website r2 in all three languages'
            git push origin HEAD:web/business-first-20260910
          fi
      - name: Export actual source and review evidence
        if: always()
        run: |
          mkdir -p qa-artifacts
          git rev-parse HEAD > qa-artifacts/review-commit.txt
          git diff 34faae11f9c63ecb031f0a727473c738b939d8fc --stat > qa-artifacts/changed-files.txt || true
          tar -czf qa-artifacts/candidate-source.tgz build_site.py business_narrative.py business-narrative.css web_release_content.py web-refresh.css tools/apply_business_narrative.py tools/web_business_qa.py release.json ko en ar index.html html-vnext '*.html' 2>/dev/null || true
          printf '%s\n' 'Owner-approved narrative; author review plus technical browser tests. Not independent reader validation, native Arabic review, physical handset testing or real inquiry receipt.' > qa-artifacts/review-boundary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-business-qa-${{ github.run_id }}
          path: qa-artifacts
          retention-days: 14
