name: Website release QA
on:
  push:
    branches: [web/refresh-20260910, main]
    paths:
      - 'tools/web-release-payload/**'
      - 'tools/web_release_qa.py'
      - 'web_release_content.py'
      - 'web-refresh.css'
      - 'build_site.py'
      - 'nc-demo-lite.js'
      - 'nc_viewer_section.py'
      - '.github/workflows/web-release-20260910.yml'
permissions:
  contents: write
concurrency:
  group: website-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser-and-content:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply checksum-verified prepared source (feature branch only)
        if: github.ref == 'refs/heads/web/refresh-20260910'
        shell: bash
        run: |
          set -euo pipefail
          if [ -d tools/web-release-payload ]; then
            cat tools/web-release-payload/*.b64 | base64 --decode > /tmp/web-release.tgz
            echo 'eab4d4ef972724e069d24c24620042494532332a2db85753d3550879963caddc  /tmp/web-release.tgz' | sha256sum -c -
            mkdir -p /tmp/web-release
            tar -xzf /tmp/web-release.tgz -C /tmp/web-release
            git apply --check /tmp/web-release/source.patch
            git apply /tmp/web-release/source.patch
            cp /tmp/web-release/web_release_content.py /tmp/web-release/web-refresh.css .
            cp /tmp/web-release/tools/web_release_qa.py tools/
            git rm -r tools/web-release-payload
          fi
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/web_release_qa.py');s=p.read_text()
          s=s.replace('el.ncViewerScene.segments.length','el.ncViewerScene.segmentCount')
          s=s.replace("page.goto(base+path,wait_until='networkidle',timeout=45000)","page.goto(base+path,wait_until='domcontentloaded',timeout=45000);page.evaluate('document.fonts.ready');page.wait_for_timeout(400)")
          s=s.replace("page.evaluate('window.scrollTo(0,0)')", "page.evaluate(\"window.scrollTo({top:0,behavior:'instant'})\")")
          s=s.replace('window.scrollTo(0,window.scrollY+el.getBoundingClientRect().top+Math.max(0,el.getBoundingClientRect().height-innerHeight)*p)', "window.scrollTo({top:window.scrollY+el.getBoundingClientRect().top+Math.max(0,el.getBoundingClientRect().height-innerHeight)*p,behavior:'instant'})")
          s=s.replace("root.evaluate('(el,p)=>window.scrollTo({top:window.scrollY+el.getBoundingClientRect().top+Math.max(0,el.getBoundingClientRect().height-innerHeight)*p,behavior:'instant'})',progress)", 'root.evaluate("(el,p)=>window.scrollTo({top:window.scrollY+el.getBoundingClientRect().top+Math.max(0,el.getBoundingClientRect().height-innerHeight)*p,behavior:\\"instant\\"})",progress)')
          s=s.replace("raw=page.locator('[data-nc-viewer]').screenshot()", "raw=page.locator('[data-nc-viewer]').screenshot(style='.site-header{visibility:hidden!important}')")
          s=s.replace("rp.goto(base+f'/{lang}/',wait_until='networkidle')", "rp.goto(base+f'/{lang}/',wait_until='domcontentloaded');rp.wait_for_timeout(500)")
          p.write_text(s)
          compile(s,str(p),'exec')
          PY
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.58.0 beautifulsoup4==4.14.3 Pillow==12.1.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Build and verify protected animation and media sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 451148d2b85a0d5022210a0399d8a02d63adc0e4 --depth=1
          python - <<'PY'
          import ast, pathlib, subprocess
          base='451148d2b85a0d5022210a0399d8a02d63adc0e4'
          for path in ['script.js','style-v5.20.css','nc-viewer-3d.js','nc-viewer-core.js','nc-viewer-canvas.js','nc-viewer-3d.css','flowmatic_nc_demo.mp4','flowmatic_ct_demo.mp4','demo-data/flowmatic-nc-sample.nc']:
              assert pathlib.Path(path).read_bytes()==subprocess.check_output(['git','show',base+':'+path]), 'Protected original changed: '+path
          old=subprocess.check_output(['git','show',base+':build_site.py']).decode().replace('\r\n','\n')
          new=pathlib.Path('build_site.py').read_text()
          for name in ['home_composition_section','operations_story_section','field_story']:
              def source(text):
                  node=next(n for n in ast.parse(text).body if isinstance(n,ast.FunctionDef) and n.name==name)
                  return ast.get_source_segment(text,node)
              assert source(old)==source(new), name+' changed'
          print('PASS: protected animation renderers, scripts, styles, NC viewer and media unchanged')
          PY
          python build_site.py
          python tools/validate_brand_contract.py
          python tools/validate_nc_public_release.py
          node --test tests/nc-viewer.test.cjs
      - name: Feature-branch browser rehearsal and actual preview capture
        id: browser
        if: github.ref == 'refs/heads/web/refresh-20260910'
        run: python tools/web_release_qa.py --browser --capture-assets
      - name: Wait for official Pages release
        if: github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import json,time,urllib.request
          for attempt in range(30):
              try:
                  u='https://flowmatic-os.com/release.json?check='+str(time.time_ns())
                  data=json.load(urllib.request.urlopen(u,timeout=15))
                  if data.get('release')=='2026.09.10-r1': break
              except Exception: pass
              time.sleep(10)
          else: raise SystemExit('Official domain did not serve the intended release')
          PY
      - name: Official-domain browser verification
        if: github.ref == 'refs/heads/main'
        run: python tools/web_release_qa.py --browser --base https://flowmatic-os.com
      - name: Export evidence and candidate source
        if: always()
        run: |
          mkdir -p qa-artifacts
          git diff --stat > qa-artifacts/change-stat.txt
          git diff -- build_site.py nc-demo-lite.js nc_viewer_section.py > qa-artifacts/source.patch
          cp web-release-notes.md qa-artifacts/ 2>/dev/null || true
          tar -czf qa-artifacts/candidate-source.tgz build_site.py web_release_content.py web-refresh.css nc-demo-lite.js nc_viewer_section.py tools/web_release_qa.py media/web-release 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-qa-${{ github.run_id }}
          path: qa-artifacts/
          retention-days: 14
      - name: Save review candidate on feature branch (never publish main here)
        if: always() && github.ref == 'refs/heads/web/refresh-20260910' && steps.browser.outcome != 'skipped'
        shell: bash
        run: |
          test -f qa-artifacts/report.json
          git config user.name 'Flowmatic Website QA'
          git config user.email 'automation@flowmatic-os.com'
          git add build_site.py nc-demo-lite.js nc_viewer_section.py web_release_content.py web-refresh.css tools/web_release_qa.py media/web-release release.json IMPLEMENTATION_NOTES.md sitemap.xml robots.txt
          git add '*.html' ko/ en/ ar/ html-vnext/
          git diff --cached --quiet || git commit -m 'Website: review candidate; inspect QA artifact before publication'
          git push origin HEAD:web/refresh-20260910
