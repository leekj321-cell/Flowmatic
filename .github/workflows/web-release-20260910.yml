name: Website declaration restoration and runtime QA
on:
  push:
    branches: [web/declaration-restore-20260910, main]
    paths:
      - business_narrative.py
      - business-narrative.css
      - homepage-declaration.json
      - tools/apply_business_narrative.py
      - tools/restore_homepage_declaration.py
      - tools/web_declaration_qa.py
      - tools/web_business_qa.py
      - build_site.py
      - web_release_content.py
      - web-refresh.css
      - .github/workflows/web-release-20260910.yml
permissions:
  contents: write
concurrency:
  group: website-declaration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification dependencies
        run: |
          python -m pip install playwright==1.58.0 beautifulsoup4==4.14.3 Pillow==12.1.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Restore only approved declaration and animation ownership
        run: |
          python tools/restore_homepage_declaration.py
          python tools/apply_business_narrative.py
          python -m py_compile business_narrative.py tools/web_declaration_qa.py
          python build_site.py
      - name: Protect original media, motion, identity and baseline checks
        run: |
          git fetch --depth=1 origin 34faae11f9c63ecb031f0a727473c738b939d8fc
          git fetch --depth=1 origin ebe68b65290e356ffb9f739f83c4c28eb811a059
          python - <<'PY'
          import ast,subprocess
          from pathlib import Path
          base='34faae11f9c63ecb031f0a727473c738b939d8fc'
          for path in ['CNAME','script.js','style-v5.20.css','nc-viewer-3d.js','nc-viewer-core.js','nc-viewer-canvas.js','nc-viewer-3d.css','flowmatic_nc_demo.mp4','flowmatic_ct_demo.mp4','demo-data/flowmatic-nc-sample.nc','brand-policy.json']:
              assert Path(path).read_bytes()==subprocess.check_output(['git','show',base+':'+path]),path
          before=subprocess.check_output(['git','show',base+':build_site.py']).decode().replace('\r\n','\n');after=Path('build_site.py').read_text()
          for name in ['home_composition_section','operations_story_section','field_story']:
              def source(text):
                  node=next(n for n in ast.parse(text).body if isinstance(n,ast.FunctionDef) and n.name==name)
                  return ast.get_source_segment(text,node)
              assert source(before)==source(after),name
          print('PASS: protected original identity, motion, renderer and media assets')
          PY
          python tools/validate_brand_contract.py
          python tools/validate_nc_public_release.py
          node --test tests/nc-viewer.test.cjs
      - name: Candidate declaration, negative fixtures and full browser regression
        if: github.ref == 'refs/heads/web/declaration-restore-20260910'
        run: python tools/web_declaration_qa.py --browser
      - name: Await exact official release
        if: github.ref == 'refs/heads/main'
        run: |
          git diff --exit-code -- business_narrative.py business-narrative.css build_site.py ko en ar release.json
          python - <<'PY'
          import json,time,urllib.request
          for i in range(45):
              try:
                  data=json.load(urllib.request.urlopen('https://flowmatic-os.com/release.json?verify='+str(time.time()),timeout=20))
                  if data.get('release')=='2026.09.10-r3':break
              except Exception as exc:print(type(exc).__name__)
              time.sleep(10)
          else:raise SystemExit('Official domain has not reached r3')
          PY
      - name: Official domain declaration and runtime regression
        if: github.ref == 'refs/heads/main'
        run: python tools/web_declaration_qa.py --browser --base https://flowmatic-os.com
      - name: Commit only a passing candidate for visual review
        if: success() && github.ref == 'refs/heads/web/declaration-restore-20260910'
        run: |
          git config user.name 'Flowmatic Web Release'
          git config user.email 'automation@flowmatic-os.com'
          git add build_site.py business_narrative.py business-narrative.css IMPLEMENTATION_NOTES.md release.json robots.txt sitemap.xml '*.html' ko en ar html-vnext
          if ! git diff --cached --quiet; then
            git commit -m 'Restore locked first-screen declaration and Operations ownership r3'
            git push origin HEAD:web/declaration-restore-20260910
          fi
      - name: Export tested source and actual screenshots
        if: always()
        run: |
          mkdir -p qa-artifacts
          git rev-parse HEAD > qa-artifacts/review-commit.txt
          git diff ebe68b65290e356ffb9f739f83c4c28eb811a059 --stat > qa-artifacts/changed-files.txt || true
          tar -czf qa-artifacts/candidate-source.tgz build_site.py business_narrative.py business-narrative.css web_release_content.py web-refresh.css homepage-declaration.json tools release.json ko en ar index.html html-vnext .github/workflows/web-release-20260910.yml 2>/dev/null || true
          printf '%s\n' 'Owner-authorized restoration. Author review and technical QA; not independent sign-off, physical-device testing, native Arabic proofreading, or real email receipt.' > qa-artifacts/review-boundary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-declaration-qa-${{ github.run_id }}
          path: qa-artifacts
          retention-days: 14
