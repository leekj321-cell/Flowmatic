name: Flowmatic formal strategic copy build and runtime QA
on:
  push:
    branches: [main]
    paths:
      - index.html
      - ko/**
      - en/**
      - ar/**
      - stc-lite-home-v1.css
      - release.json
      - build_site.py
      - business_narrative.py
      - business-narrative.css
      - web_release_content.py
      - web-refresh.css
      - tools/build_stc_r5_site.py
      - tools/stc_r5_qa.py
      - tools/validate_strategic_copy.py
      - STRATEGIC_COMMUNICATIONS_CONTRACT.md
      - INVESTOR_COPY_CONTRACT.md
      - tools/web_declaration_qa.py
      - tools/web_release_qa.py
      - tools/apply_business_narrative.py
      - .github/workflows/web-release-20260910.yml
  pull_request:
    branches: [main]
    paths:
      - index.html
      - ko/**
      - en/**
      - ar/**
      - stc-lite-home-v1.css
      - release.json
      - build_site.py
      - business_narrative.py
      - business-narrative.css
      - web_release_content.py
      - web-refresh.css
      - tools/build_stc_r5_site.py
      - tools/stc_r5_qa.py
      - tools/validate_strategic_copy.py
      - STRATEGIC_COMMUNICATIONS_CONTRACT.md
      - INVESTOR_COPY_CONTRACT.md
      - tools/web_declaration_qa.py
      - tools/web_release_qa.py
      - .github/workflows/web-release-20260910.yml
permissions:
  contents: read
concurrency:
  group: investor-home-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install website QA dependencies
        run: |
          python -m pip install playwright==1.58.0 beautifulsoup4==4.14.3 Pillow==12.1.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Build canonical value-loop website
        run: |
          python tools/apply_business_narrative.py
          python -m py_compile tools/build_stc_r5_site.py tools/stc_r5_qa.py tools/validate_strategic_copy.py tools/web_declaration_qa.py tools/web_release_qa.py
          python tools/build_stc_r5_site.py
          git diff --exit-code -- index.html ko en ar release.json
      - name: Strategic copy contract
        run: |
          python tools/validate_strategic_copy.py --self-test --profile public-web ko/index.html en/index.html ar/index.html
      - name: Protect corporate identity and NC public demo
        run: |
          python tools/validate_brand_contract.py
          python tools/validate_nc_public_release.py
          node --test tests/nc-viewer.test.cjs
      - name: Value-loop static and browser regression
        run: python tools/stc_r5_qa.py --browser
      - name: Await official GitHub Pages value-loop release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import json,time,urllib.request
          expected='2026.09.20-r6.2-formal-copy'
          for _ in range(45):
              try:
                  with urllib.request.urlopen('https://flowmatic-os.com/release.json?verify='+str(time.time()),timeout=20) as response:
                      data=json.load(response)
                  if data.get('release')==expected:
                      print('Official domain reached',expected)
                      break
              except Exception as exc:
                  print(type(exc).__name__)
              time.sleep(10)
          else:
              raise SystemExit('Official domain has not reached formal strategic copy release')
          PY
      - name: Official-domain value-loop runtime regression
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python tools/stc_r5_qa.py --browser --base https://flowmatic-os.com
      - name: Export QA evidence
        if: always()
        run: |
          mkdir -p qa-artifacts
          git rev-parse HEAD > qa-artifacts/review-commit.txt
          git status --short > qa-artifacts/working-tree.txt
          printf '%s\n' 'Investor-first canonical homepage. Browser QA is Chromium-based; Arabic native-speaker proofreading and physical-device certification remain outside this automated check.' > qa-artifacts/review-boundary.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: investor-home-qa-${{ github.run_id }}
          path: qa-artifacts
          retention-days: 14
