<rect class="box" x="610" y="155" width="235" height="145" rx="6"/><text x="727" y="195" text-anchor="middle" font-size="19" font-weight="700">METROLOGY</text><text x="727" y="228" text-anchor="middle" font-size="13">µm measurement · CMM</text><text x="727" y="260" text-anchor="middle" font-size="12">KEEP</text>
<rect class="box" x="880" y="155" width="235" height="145" rx="6"/><text x="997" y="195" text-anchor="middle" font-size="19" font-weight="700">ERP / MES</text><text x="997" y="228" text-anchor="middle" font-size="13">system of record</text><text x="997" y="260" text-anchor="middle" font-size="12">CONNECT</text>
