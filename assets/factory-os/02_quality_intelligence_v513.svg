<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img"><style>
:root{--b:#1565D8;--r:#E53935;--y:#F4C20D;--k:#111;--bg:#FAFAF7;--g:#D9D9D4}
text{font-family:Arial,Helvetica,sans-serif;fill:var(--k)}
.box{fill:white;stroke:var(--k);stroke-width:1.5}.core{fill:#eef4ff;stroke:var(--b);stroke-width:2}.tower{fill:#fff7cc;stroke:var(--k);stroke-width:2}
.flow{stroke:var(--k);stroke-width:2;fill:none;stroke-dasharray:5 6;animation:dash 8s linear infinite}.pulse{animation:pulse 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dash{to{stroke-dashoffset:-88}}@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.flow,.pulse{animation:none!important}}
</style><rect width="100%" height="100%" fill="#FAFAF7"/><text x="60" y="70" font-size="28" font-weight="700">Quality Intelligence v0.5.13</text>
<text x="60" y="105" font-size="15">Capture → Standardize → Quantify → Prioritize → Act → Verify</text>
<rect class="box" x="70" y="160" width="195" height="105" rx="6"/><text x="167" y="200" text-anchor="middle" font-size="18" font-weight="700">EVIDENCE</text><text x="167" y="230" text-anchor="middle" font-size="13">inspection · LOT · image</text>
<rect class="box" x="325" y="160" width="195" height="105" rx="6"/><text x="422" y="200" text-anchor="middle" font-size="18" font-weight="700">QUANTIFY</text><text x="422" y="230" text-anchor="middle" font-size="13">PPM · loss · price context</text>
<rect class="box" x="580" y="160" width="195" height="105" rx="6"/><text x="677" y="200" text-anchor="middle" font-size="18" font-weight="700">PRIORITIZE</text><text x="677" y="230" text-anchor="middle" font-size="13">P1/P2/P3 · reason · confidence</text>
<rect class="box" x="835" y="160" width="195" height="105" rx="6"/><text x="932" y="200" text-anchor="middle" font-size="18" font-weight="700">WORKLIST</text><text x="932" y="230" text-anchor="middle" font-size="13">owner · status · next check</text>
<path class="flow" d="M265 212H325 M520 212H580 M775 212H835"/>
<rect class="core" x="245" y="370" width="710" height="115" rx="8"/><text x="600" y="410" text-anchor="middle" font-size="21" font-weight="700">ANALYSIS RANGE + HIERARCHY CONTEXT</text><text x="600" y="443" text-anchor="middle" font-size="13">re-prioritize by period · factory/group summary · price provenance</text>
<path class="flow" d="M600 485V545"/><rect class="tower" x="390" y="545" width="420" height="90" rx="8"/><text x="600" y="580" text-anchor="middle" font-size="20" font-weight="700">VERIFY EFFECT / RECURRENCE</text><text x="600" y="607" text-anchor="middle" font-size="13">observe → effect confirmed → recurrence</text></svg>