<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img"><style>
:root{--b:#1565D8;--r:#E53935;--y:#F4C20D;--k:#111;--bg:#FAFAF7;--g:#D9D9D4}
text{font-family:Arial,Helvetica,sans-serif;fill:var(--k)}
.box{fill:white;stroke:var(--k);stroke-width:1.5}.core{fill:#eef4ff;stroke:var(--b);stroke-width:2}.tower{fill:#fff7cc;stroke:var(--k);stroke-width:2}
.flow{stroke:var(--k);stroke-width:2;fill:none;stroke-dasharray:5 6;animation:dash 8s linear infinite}.pulse{animation:pulse 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dash{to{stroke-dashoffset:-88}}@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.flow,.pulse{animation:none!important}}
</style><rect width="100%" height="100%" fill="#FAFAF7"/><text x="60" y="70" font-size="28" font-weight="700">Four Intelligence Domains → Factory OS</text><rect class="box pulse" x="70" y="130" width="220" height="150" rx="6" fill="#eaf2ff"/><text x="88" y="175" font-size="20" font-weight="700">QUALITY</text><text x="88" y="210" font-size="14">Evidence · Priority · Verify</text><text x="88" y="245" font-size="12">domain intelligence</text><path class="flow" d="M 180 280 L 180 365"/><rect class="box pulse" x="350" y="130" width="220" height="150" rx="6" fill="#fff8d6"/><text x="368" y="175" font-size="20" font-weight="700">MACHINING</text><text x="368" y="210" font-size="14">NC · CT · Tool · Standard</text><text x="368" y="245" font-size="12">domain intelligence</text><path class="flow" d="M 460 280 L 460 365"/><rect class="box pulse" x="630" y="130" width="220" height="150" rx="6" fill="#f8eeee"/><text x="648" y="175" font-size="20" font-weight="700">OPERATIONS</text><text x="648" y="210" font-size="14">Cost · Labor · Consumption</text><text x="648" y="245" font-size="12">domain intelligence</text><path class="flow" d="M 740 280 L 740 365"/><rect class="box pulse" x="910" y="130" width="220" height="150" rx="6" fill="#eef7ee"/><text x="928" y="175" font-size="20" font-weight="700">LOGISTICS</text><text x="928" y="210" font-size="14">Demand · Dispatch · Confirm</text><text x="928" y="245" font-size="12">domain intelligence</text><path class="flow" d="M 1020 280 L 1020 365"/><rect class="core" x="245" y="365" width="710" height="90" rx="8"/><text x="600" y="405" text-anchor="middle" font-size="22" font-weight="700">SHARED MANUFACTURING CONTEXT + EVENT CORE</text><text x="600" y="435" text-anchor="middle" font-size="13">factory · line · equipment · product · lot · tool · worker · task · material · time</text><path class="flow" d="M600 455 L600 525"/><rect class="tower" x="390" y="525" width="420" height="110" rx="8"/><text x="600" y="570" text-anchor="middle" font-size="24" font-weight="700">CONTROL TOWER</text><text x="600" y="603" text-anchor="middle" font-size="14">cross-domain loss · risk · priority · next action</text></svg>