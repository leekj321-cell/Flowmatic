<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img"><style>
:root{--b:#1565D8;--r:#E53935;--y:#F4C20D;--k:#111;--bg:#FAFAF7;--g:#D9D9D4}
text{font-family:Arial,Helvetica,sans-serif;fill:var(--k)}
.box{fill:white;stroke:var(--k);stroke-width:1.5}.core{fill:#eef4ff;stroke:var(--b);stroke-width:2}.tower{fill:#fff7cc;stroke:var(--k);stroke-width:2}
.flow{stroke:var(--k);stroke-width:2;fill:none;stroke-dasharray:5 6;animation:dash 8s linear infinite}.pulse{animation:pulse 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dash{to{stroke-dashoffset:-88}}@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.flow,.pulse{animation:none!important}}
</style><rect width="100%" height="100%" fill="#FAFAF7"/><text x="60" y="70" font-size="28" font-weight="700">Operations Intelligence</text>
<text x="60" y="105" font-size="15">Intake → Resolve → Allocate → Track → Normalize → Detect</text>
<rect class="box" x="70" y="165" width="180" height="115" rx="6"/><text x="160" y="205" text-anchor="middle" font-size="18" font-weight="700">INTAKE</text><text x="160" y="235" text-anchor="middle" font-size="13">mail · chat · request</text>
<rect class="box" x="300" y="165" width="180" height="115" rx="6"/><text x="390" y="205" text-anchor="middle" font-size="18" font-weight="700">RESOLVE</text><text x="390" y="235" text-anchor="middle" font-size="13">item · spec · qty · UOM</text>
<rect class="box" x="530" y="165" width="180" height="115" rx="6"/><text x="620" y="205" text-anchor="middle" font-size="18" font-weight="700">ALLOCATE</text><text x="620" y="235" text-anchor="middle" font-size="13">use location · split qty</text>
<rect class="box" x="760" y="165" width="180" height="115" rx="6"/><text x="850" y="205" text-anchor="middle" font-size="18" font-weight="700">TRACK</text><text x="850" y="235" text-anchor="middle" font-size="13">tool · consumable · labor</text>
<path class="flow" d="M250 222H300 M480 222H530 M710 222H760"/>
<rect class="core" x="250" y="365" width="700" height="110" rx="8"/><text x="600" y="405" text-anchor="middle" font-size="21" font-weight="700">TRACKED OPERATIONAL COST</text><text x="600" y="437" text-anchor="middle" font-size="14">cost / good EA · man-hour / 1,000 EA · consumption / 1,000 EA · running hour</text>
<path class="flow" d="M600 475V535"/><rect class="tower" x="410" y="535" width="380" height="95" rx="8"/><text x="600" y="575" text-anchor="middle" font-size="20" font-weight="700">ANOMALY CANDIDATES</text><text x="600" y="603" text-anchor="middle" font-size="13">Rolling Median + MAD · EWMA</text></svg>